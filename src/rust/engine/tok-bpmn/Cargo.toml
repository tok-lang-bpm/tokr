[package]
name = "tok-bpmn"
version = "1.0.3"
edition = "2024"
rust-version = "1.88"
license = "GPL-3.0-or-later"
authors = ["Marek Deja"]
repository = "https://github.com/tok-lang-bpm/tok"
homepage = "https://tok-lang-bpm.github.io/"
documentation = "https://docs.rs/tok-bpmn"
readme = "README.md"
# the tests and examples read the conformance corpus and the fixtures of the repository
exclude = ["tests/", "examples/"]
keywords = ["bpmn", "layout", "svg", "diagram", "tok"]
categories = ["visualization", "science"]
description = "BPMN 2.0 rules, automatic layout and SVG rendering used by tok"

[dependencies]
roxmltree = "0.21.2"
serde_json = "1.0.154"
thiserror = "2.0.21"

